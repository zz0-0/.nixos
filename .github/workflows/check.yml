name: check

on:
  push:
    branches: [main]
    paths:
      - "**/*.nix"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "**/*.nix"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Evaluate both hosts
        run: nix flake check --no-build

      - name: Lint
        run: |
          nix --extra-experimental-features 'nix-command flakes' develop --command bash -c '
            statix check .
            deadnix --fail .
            nixfmt --check $(git ls-files "*.nix")
          '

  # Only the active host is built automatically. The zz host is still
  # evaluated by the flake job; build it locally when needed:
  #   nix build .#nixosConfigurations.zz.config.system.build.toplevel
  # This keeps Actions usage down while still catching zz2 kernel/NVIDIA
  # build failures.
  build:
    name: build (zz2)
    runs-on: ubuntu-latest
    needs: flake
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build active NixOS system
        run: nix build --no-link .#nixosConfigurations.zz2.config.system.build.toplevel
