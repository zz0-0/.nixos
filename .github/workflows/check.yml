name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Evaluate both hosts
        run: nix flake check --no-build

      - name: Lint
        run: |
          nix --extra-experimental-features 'nix-command flakes' develop --command bash -c '
            statix check .
            deadnix --fail .
            nixfmt --check $(git ls-files "*.nix")
          '

  # Strict build check: evaluation alone does not catch failures in the
  # out-of-tree kernel modules or the patched NVIDIA driver. If the hosted
  # runner runs out of disk/time, move this job to a self-hosted runner or add
  # a binary cache (Cachix/attic).
  build:
    name: build (${{ matrix.host }})
    runs-on: ubuntu-latest
    needs: flake
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        host: [zz, zz2]
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build NixOS system
        run: nix build --no-link .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel
